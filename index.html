<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海路中轉</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A1412'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23C9A06A' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23C9A06A'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#0A1412;
    --ink-2:#101E1A;
    --paper:#EDE7D6;
    --brass:#C09659;
    --brass-soft:#D8B27A;
    --jade:#5E9C94;
    --fog:#7C948A;
    --line:#25352F;
    --font-display:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong",Georgia,"Times New Roman",serif;
    --font-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:radial-gradient(120% 80% at 50% 0%,#13221D 0%,#0A1412 58%,#050B09 100%);
    color:var(--paper);
    font-family:var(--font-ui);
    font-size:15px;
    line-height:1.6;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .is-hidden{display:none !important}

  .masthead{padding:26px 20px 16px;max-width:1180px;margin:0 auto}
  .mast-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .mast-actions{flex:none;display:flex;align-items:center;gap:8px}
  .mast-reset{flex:none;align-self:center;padding:7px 13px;min-height:34px;font-size:12px;letter-spacing:.08em}
  .mast-title{
    font-family:var(--font-display);font-weight:600;
    font-size:clamp(26px,7.2vw,44px);line-height:1.12;
    letter-spacing:.14em;margin:0;color:var(--paper);
  }
  .mast-title em{font-style:normal;color:var(--brass)}
  .rule{height:1px;max-width:1180px;margin:18px auto 0;opacity:.5;
    background:linear-gradient(90deg,var(--brass) 0%,#3A4C45 45%,transparent 100%)}

  /* ===== 玩法选择 ===== */
  .lobby{max-width:1180px;margin:0 auto;padding:34px 20px 60px}
  .lobby-lead{margin:0 0 26px;color:var(--fog);font-size:14px;line-height:1.8;max-width:36ch}
  .modes{display:grid;gap:14px;max-width:560px}
  @media (min-width:760px){.modes{grid-template-columns:1fr 1fr;max-width:720px;gap:20px}}
  .mode{
    display:flex;flex-direction:column;align-items:flex-start;gap:8px;
    padding:22px 20px 24px;min-height:132px;
    text-align:left;font:inherit;color:inherit;
    background:rgba(16,30,26,.55);
    border:1px solid var(--line);
    cursor:pointer;
    transition:border-color .25s ease,background .25s ease,transform .25s ease;
  }
  .mode:hover{border-color:var(--brass);background:rgba(24,44,38,.7);transform:translateY(-2px)}
  .mode:focus-visible{outline:1px solid var(--brass);outline-offset:3px}
  .mode-name{font-family:var(--font-display);font-size:26px;letter-spacing:.14em;color:var(--paper)}
  .mode-desc{font-size:13px;line-height:1.7;color:var(--fog);margin:0}

  .langs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:30px}
  .langs-label{font-size:11px;letter-spacing:.18em;color:var(--fog);margin-right:4px}
  .lang{
    padding:8px 14px;min-height:38px;font:inherit;font-size:13px;letter-spacing:.04em;
    background:none;border:1px solid var(--line);color:var(--fog);cursor:pointer;
    transition:color .2s ease,border-color .2s ease,background .2s ease;
  }
  .lang:hover{color:var(--paper);border-color:var(--jade)}
  .lang[aria-pressed="true"]{color:var(--ink);background:var(--brass-soft);border-color:var(--brass-soft)}
  .lang:focus-visible{outline:1px solid var(--brass);outline-offset:3px}

  .stage{display:grid;gap:22px;padding:20px 16px 26px;max-width:1180px;margin:0 auto}
  @media (min-width:920px){
    .stage{grid-template-columns:minmax(0,1fr) 320px;gap:46px;align-items:start;padding:28px 48px 44px}
  }

  /* ===== 地图 ===== */
  .chart-wrap{display:flex;justify-content:center}
  .chart{
    position:relative;width:100%;max-width:680px;
    aspect-ratio:4096/2748;
    border:1px solid var(--line);
    background:#0A1412;
    isolation:isolate;
    overflow:hidden;
  }
  .chart-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    filter:brightness(.97) contrast(1.01) saturate(.96)}
  .corner{position:absolute;width:14px;height:14px;opacity:.55;pointer-events:none;z-index:3}
  .corner.tl{top:7px;left:7px;border-top:1px solid var(--brass);border-left:1px solid var(--brass)}
  .corner.tr{top:7px;right:7px;border-top:1px solid var(--brass);border-right:1px solid var(--brass)}
  .corner.bl{bottom:7px;left:7px;border-bottom:1px solid var(--brass);border-left:1px solid var(--brass)}
  .corner.br{bottom:7px;right:7px;border-bottom:1px solid var(--brass);border-right:1px solid var(--brass)}

  .route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  .route line{stroke:var(--brass);stroke-width:1.3;vector-effect:non-scaling-stroke;opacity:0;transition:opacity .5s ease}
  .route line.on{opacity:.62}

  .node-layer{position:absolute;inset:0;z-index:2}

  .node{
    position:absolute;transform:translate(-50%,-50%);
    display:grid;place-items:center;
    width:44px;height:44px;padding:0;
    background:none;border:0;color:inherit;font:inherit;text-decoration:none;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .node .halo{
    position:absolute;width:76px;height:76px;border-radius:50%;
    background:radial-gradient(circle,rgba(216,178,122,.42),rgba(216,178,122,0) 66%);
    opacity:0;transition:opacity .4s ease;pointer-events:none;
  }
  .node .ring{
    position:relative;display:grid;place-items:center;
    width:26px;height:26px;border-radius:50%;
    background:rgba(10,20,18,.30);
    border:1px solid rgba(10,20,18,.62);
    transition:border-color .35s ease,background .35s ease,transform .35s ease,box-shadow .35s ease;
  }
  @media (min-width:920px){.node .ring{width:32px;height:32px}}
  .node .glyph{display:grid;place-items:center;font-size:10px;color:rgba(10,20,18,.78);transition:color .35s ease}
  .node .chip{
    position:absolute;top:100%;left:50%;transform:translate(-50%,6px);
    padding:3px 8px 4px;
    background:rgba(9,18,16,.82);
    color:var(--paper);
    font-size:11.5px;letter-spacing:.04em;line-height:1.35;
    white-space:nowrap;pointer-events:none;
    opacity:0;transition:opacity .3s ease;
  }

  .node[data-state="next"] .halo{opacity:1;animation:breathe 3.4s ease-in-out infinite}
  .node[data-state="next"] .ring{border-color:var(--brass);border-width:2px;background:rgba(237,231,214,.42);
    box-shadow:0 0 0 4px rgba(237,231,214,.22),0 0 16px rgba(216,178,122,.55)}
  .node[data-state="next"] .glyph{color:#12201C}
  .node[data-state="next"] .chip{opacity:1}

  .node[data-state="done"] .ring{border-color:rgba(10,20,18,.75);background:rgba(237,231,214,.5)}
  .node[data-state="done"] .glyph{color:#12201C}

  .node[data-state="peer"] .ring{border-color:rgba(94,156,148,.85);border-style:dotted;background:rgba(10,20,18,.18)}
  .node[data-state="peer"] .chip{opacity:1;background:rgba(14,38,36,.86);color:var(--jade)}
  .node[data-state="peerDone"] .ring{border-color:var(--jade);background:rgba(94,156,148,.24)}

  .node[data-state="next"]:hover .ring{transform:scale(1.1)}
  .node:focus-visible{outline:none}
  .node:focus-visible .ring{box-shadow:0 0 0 3px rgba(216,178,122,.85)}

  @keyframes breathe{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
  @media (prefers-reduced-motion:reduce){
    .node[data-state="next"] .halo{animation:none;opacity:.7}
    .node .ring{transition:none}
  }

  /* ===== 侧栏 ===== */
  .panel{width:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
  @media (min-width:920px){.panel{margin:0;position:sticky;top:36px}}
  .counter{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .counter-num{font-family:var(--font-display);font-size:40px;line-height:1;color:var(--paper)}
  .counter-num small{font-size:17px;color:var(--fog);letter-spacing:.04em}
  .counter-label{font-size:10.5px;letter-spacing:.18em;color:var(--fog)}
  .ticks{display:flex;gap:6px}
  .tick{height:3px;flex:1;background:var(--line);transition:background .4s ease}
  .tick.on{background:var(--brass)}
  .tick.peer{background:var(--jade)}
  .hp{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .hp-label{font-size:10.5px;letter-spacing:.16em;color:var(--fog)}
  .hp-bar{position:relative;flex:1;min-width:64px;height:6px;background:#16241F;border:1px solid var(--line)}
  .hp-fill{position:absolute;top:0;left:0;bottom:0;width:100%;background:var(--brass-soft);transition:width .25s ease}
  .hp-input{width:62px;flex:none;padding:6px 8px;font-family:var(--font-ui);font-size:16px;text-align:center;color:var(--paper);background:rgba(16,30,26,.65);border:1px solid var(--line);border-radius:0;-moz-appearance:textfield}
  .hp-input::-webkit-outer-spin-button,.hp-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .hp-input:focus{outline:none;border-color:var(--brass)}
  .hp-step{display:flex;gap:6px;margin-left:auto}
  .hp-btn{width:34px;height:34px;display:grid;place-items:center;background:none;border:1px solid var(--line);color:var(--fog);font-size:14px;cursor:pointer;transition:color .2s ease,border-color .2s ease}
  .hp-btn:hover:not(:disabled){color:var(--paper);border-color:var(--brass)}
  .hp-btn:disabled{opacity:.35;cursor:default}
  .die-btn{flex:none;padding:9px 14px;font-family:var(--font-ui);font-size:12.5px;letter-spacing:.04em;color:var(--brass-soft);background:none;border:1px solid rgba(216,178,122,.55);cursor:pointer;transition:color .2s ease,border-color .2s ease,opacity .2s ease}
  .die-btn:hover:not(:disabled){color:var(--paper);border-color:var(--brass)}
  .die-btn:disabled{opacity:.35;cursor:default}
  .hp-note{font-size:11.5px;color:var(--fog);line-height:1.7;margin-top:-4px}
  .hp.attn{outline:1px solid var(--brass-soft);outline-offset:5px;animation:attnPulse 1.5s ease-in-out 2}
  @keyframes attnPulse{0%,100%{outline-color:rgba(216,178,122,.3)}50%{outline-color:var(--brass-soft)}}
  .status-line{font-size:14px;color:var(--paper);line-height:1.65;margin:0;min-height:46px}
  .status-line span{color:var(--brass-soft)}

  .stops{list-style:none;margin:0;padding:14px 0 0;border-top:1px solid var(--line)}
  .stops li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:9px 0}
  .stops li + li{border-top:1px solid rgba(37,53,47,.5)}
  .s-idx{font-family:var(--font-display);font-size:10.5px;letter-spacing:.1em;color:var(--fog)}
  .s-name{font-size:14px;color:rgba(237,231,214,.62)}
  .s-nm{display:block}
  .s-nt{display:block;font-size:11px;color:var(--fog);letter-spacing:.02em;margin-top:1px;line-height:1.5}
  .s-state{font-size:10.5px;letter-spacing:.06em;color:var(--fog);white-space:nowrap}
  .stops li[data-state="next"] .s-name{color:var(--paper)}
  .stops li[data-state="next"] .s-state{color:var(--brass-soft)}
  .stops li[data-state="done"] .s-name{color:rgba(237,231,214,.9)}
  .stops li[data-state="done"] .s-state{color:var(--brass)}
  .stops li[data-state="peer"] .s-name{color:rgba(237,231,214,.72)}
  .stops li[data-state="peer"] .s-state{color:var(--jade)}
  .stops li[data-state="peerDone"] .s-name{color:rgba(237,231,214,.9)}
  .stops li[data-state="peerDone"] .s-state{color:var(--jade)}

  .hint{font-size:12.5px;color:var(--fog);line-height:1.8;padding-top:14px;border-top:1px solid var(--line)}
  .ghost{
    align-self:flex-start;padding:9px 14px;min-height:40px;
    background:none;border:1px solid var(--line);color:var(--fog);
    font:inherit;font-size:13px;letter-spacing:.04em;cursor:pointer;
    transition:color .25s ease,border-color .25s ease;
  }
  .ghost:hover{color:var(--paper);border-color:var(--brass)}
  .ghost:focus-visible{outline:1px solid var(--brass);outline-offset:3px}

  /* ===== 遮罩层 ===== */
  .veil{position:fixed;inset:0;z-index:30;padding:26px;display:none;place-items:center;
    background:rgba(5,11,9,.88)}
  .veil.on{display:grid}
  .veil-box{width:100%;max-width:420px;text-align:center;padding:8px}
  .veil-title{font-family:var(--font-display);font-size:26px;letter-spacing:.1em;margin:0 0 12px;color:var(--paper)}
  .veil-text{font-size:13.5px;line-height:1.85;color:var(--fog);margin:0 0 22px;min-height:52px}
  .veil-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .veil-actions .ghost{align-self:auto;padding:10px 18px;color:var(--paper);border-color:var(--brass)}
  .veil-actions .ghost:hover{background:rgba(192,150,89,.12)}
  .wheel{
    width:34px;height:34px;margin:0 auto 18px;border-radius:50%;
    border:1px solid rgba(216,178,122,.45);
    position:relative;
  }
  .wheel::after{
    content:"";position:absolute;inset:-1px;border-radius:50%;
    border:1px solid transparent;border-top-color:var(--brass);
    animation:spin 1.2s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.wheel::after{animation:none;border-top-color:var(--brass)}}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
    max-width:min(92vw,430px);padding:12px 16px;
    background:var(--paper);color:#10201C;
    font-size:13px;line-height:1.6;box-shadow:0 10px 34px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease;z-index:40;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header class="masthead">
  <div class="mast-row">
    <h1 class="mast-title"><span id="mastA">海路</span><em id="mastB">中轉</em></h1>
    <div class="mast-actions">
      <button class="ghost mast-reset is-hidden" id="modeBtn" type="button">切換模式</button>
      <button class="ghost mast-reset is-hidden" id="headBtn" type="button">重置航程</button>
    </div>
  </div>
  <div class="rule"></div>
</header>

<section class="lobby" id="lobby">
  <p class="lobby-lead" id="lobbyLead">四座島，一條遷徙路線。選一種走法開始。</p>
  <div class="modes">
    <button class="mode" data-mode="solo" type="button">
      <span class="mode-name" id="soloName">單人</span>
      <span class="mode-desc" id="soloDesc">自己走完四站，順序不限，走到哪站算哪站。</span>
    </button>
    <button class="mode" data-mode="duo" type="button">
      <span class="mode-name" id="duoName">雙人</span>
      <span class="mode-desc" id="duoDesc">兩人輪流上場，從朝鮮半島一路南下，一人玩遊戲，另一人負責記錄剩餘血量。</span>
    </button>
  </div>
  <div class="langs" id="langs" role="group" aria-label="Language">
    <span class="langs-label" id="langLabel">語言</span>
    <button class="lang" type="button" data-lang="zh-Hant" lang="zh-Hant" aria-pressed="true">繁體中文</button>
    <button class="lang" type="button" data-lang="zh-Hans" lang="zh-Hans" aria-pressed="false">简体中文</button>
    <button class="lang" type="button" data-lang="en" lang="en" aria-pressed="false">English</button>
  </div>
</section>

<main class="stage is-hidden" id="stage">
  <div class="chart-wrap">
    <div class="chart" id="chart">
      <img class="chart-img" id="chartImg" alt="">
      <svg class="route" id="route" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="node-layer" id="nodeLayer"></div>
      <span class="corner tl" aria-hidden="true"></span>
      <span class="corner tr" aria-hidden="true"></span>
      <span class="corner bl" aria-hidden="true"></span>
      <span class="corner br" aria-hidden="true"></span>
    </div>
  </div>

  <aside class="panel">
    <div class="counter">
      <div class="counter-num"><span id="doneNum">0</span><small id="doneTotal"> / 4</small></div>
      <div class="counter-label" id="counterLabel">已抵達</div>
    </div>
    <div class="ticks" id="ticks" aria-hidden="true"></div>
    <div class="hp" id="hpBlock">
      <span class="hp-label" id="hpLabel">航程血量</span>
      <span class="hp-bar" id="hpBar" aria-hidden="true"><span class="hp-fill" id="hpFill"></span></span>
      <input class="hp-input" id="hpInput" type="number" inputmode="numeric" min="0" max="100" step="1" value="100" aria-label="航程血量">
      <span class="hp-step">
        <button class="hp-btn" id="hpDown" type="button" aria-label="减少血量">−</button>
        <button class="hp-btn" id="hpUp" type="button" aria-label="增加血量">+</button>
      </span>
      <button class="die-btn is-hidden" id="duoConfirmBtn" type="button">確認記錄</button>
      <button class="die-btn is-hidden" id="dieBtn" type="button">血量耗盡</button>
    </div>
    <div class="hp-note" id="hpNote"></div>
    <p class="status-line" id="statusLine"></p>
    <ol class="stops" id="stops"></ol>
    <div class="hint" id="hintText"></div>
  </aside>
</main>

<div class="veil" id="searchVeil" role="dialog" aria-modal="true">
  <div class="veil-box">
    <div class="wheel" aria-hidden="true"></div>
    <h2 class="veil-title" id="searchTitle">正在尋找另一位玩家</h2>
    <p class="veil-text" id="searchText">正在連接配對伺服器…</p>
    <div class="veil-actions">
      <button class="ghost" id="cancelSearch" type="button">取消</button>
    </div>
  </div>
</div>

<div class="veil" id="winVeil" role="dialog" aria-modal="true">
  <div class="veil-box">
    <h2 class="veil-title" id="winTitle">航程完成</h2>
    <p class="veil-text" id="winText"></p>
    <div class="veil-actions">
      <button class="ghost" id="backHome" type="button">回到首頁</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://fastly.jsdelivr.net/npm/mqtt@4.3.7/dist/mqtt.min.js"></script>
<script>
/* ==================================================================
   配置区：换图、填网址、调坐标，只动这一段

const HP_KEY = 'seahub_hp_v1';
let hp = (() => {
  const saved = parseInt(localStorage.getItem(HP_KEY), 10);
  if (Number.isFinite(saved) && saved >= 0) return Math.min(saved, CONFIG.HP_MAX);
  try {
    const q = parseInt(new URLSearchParams(location.search).get(CONFIG.HP_PARAM), 10);
    if (Number.isFinite(q)) return Math.min(Math.max(q, 0), CONFIG.HP_MAX);
  } catch (e) {}
  return CONFIG.HP_MAX;
})();
function clampHp(v) { return Math.max(0, Math.min(CONFIG.HP_MAX, v)); }

const SETTLE_KEY = 'seahub_settle_v1';
let pendingStop = (() => {
  try {
    const v = localStorage.getItem(SETTLE_KEY);
    const n = v === null ? NaN : parseInt(v, 10);
    return Number.isInteger(n) && n >= 0 ? n : null;
  } catch (e) { return null; }
})();
function markPending(i) {
  pendingStop = i;
  try { localStorage.setItem(SETTLE_KEY, String(i)); } catch (e) {}
}
function clearPending() {
  pendingStop = null;
  try { localStorage.removeItem(SETTLE_KEY); } catch (e) {}
  if (el.hpBlock) el.hpBlock.classList.remove('attn');
}
function promptSettle() {
  if (pendingStop === null || !el.hpBlock) return;
  const dict = d();
  showToast(dict.toastSettle(dict.nodes[pendingStop].name));
  el.hpBlock.classList.add('attn');
  setTimeout(() => el.hpBlock.classList.remove('attn'), 4200);
}
function saveHp() { try { localStorage.setItem(HP_KEY, String(hp)); } catch (e) {} }

function withHp(url) {
  if (!url) return url;
  const [base, hash] = url.split('#');
  const sep = base.includes('?') ? '&' : '?';
  return base + sep + CONFIG.HP_PARAM + '=' + hp + (hash ? '#' + hash : '');
}

function isMyTurn() {
  if (mode !== 'duo' || !role) return false;
  return (duoIdx % 2 === 0) === (role === 'host');
}

function syncHpState() {
  if (!el.hpInput) return;
  const dict = d();
  const locked = mode === 'duo' && (duoOver || isMyTurn() || !duoOpen);
  el.hpInput.disabled = locked;
  const curHp = (mode === 'duo' && !locked) ? readDraft() : hp;
  el.hpDown.disabled = locked || curHp <= 0;
  el.hpUp.disabled = locked || curHp >= CONFIG.HP_MAX;
  if (el.dieBtn) {
    const show = mode === 'duo' && !duoOver;
    el.dieBtn.classList.toggle('is-hidden', !show);
    el.dieBtn.disabled = !show || isMyTurn() || !partner;
    el.dieBtn.textContent = dict.dieBtn;
  }
  if (el.duoConfirmBtn) {
    const need = mode === 'duo' && !duoOver && !isMyTurn() && duoOpen;
    el.duoConfirmBtn.classList.toggle('is-hidden', !need);
    el.duoConfirmBtn.disabled = !need;
    el.duoConfirmBtn.textContent = dict.duoConfirm;
  }
  if (el.hpNote) {
    el.hpNote.textContent = mode === 'duo'
      ? (isMyTurn() ? dict.hpPilotNote(hp) : dict.hpRecNote(hp))
      : dict.hpNote(hp);
  }
}

function renderHp() {
  if (!el.hpFill) return;
  el.hpFill.style.width = (hp / CONFIG.HP_MAX * 100) + '%';
  if (document.activeElement !== el.hpInput) el.hpInput.value = String(hp);
  syncHpState();
}

function loadSolo() {
  try {
    const raw = JSON.parse(localStorage.getItem(SOLO_KEY) || '[]');
    return Array.isArray(raw) ? raw.filter(i => Number.isInteger(i) && i >= 0 && i < TOTAL) : [];
  } catch (e) { return []; }
}
function saveSolo() { localStorage.setItem(SOLO_KEY, JSON.stringify([...soloDone])); }

  }
  a.innerHTML =
    '<span class="halo"></span>' +
    '<span class="ring"><span class="glyph"></span></span>' +
    '<span class="chip"></span>';
  a.addEventListener('click', (e) => onNodeClick(e, i));
  el.nodeLayer.appendChild(a);
});

CONFIG.NODES.forEach((n, i) => {
  if (i === TOTAL - 1) return;
  const next = CONFIG.NODES[i + 1];
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', n.x); line.setAttribute('y1', n.y);
  line.setAttribute('x2', next.x); line.setAttribute('y2', next.y);
  line.dataset.segment = String(i);
  el.route.appendChild(line);
});

CONFIG.NODES.forEach((n, i) => {
  const t = document.createElement('span');
  t.className = 'tick';
  el.ticks.appendChild(t);

  const li = document.createElement('li');
  li.dataset.state = 'idle';
  li.innerHTML =
    '<span class="s-idx">' + String(i + 1).padStart(2, '0') + '</span>' +
    '<span class="s-name"><span class="s-nm"></span><span class="s-nt"></span></span>' +
    '<span class="s-state"></span>';
  el.stops.appendChild(li);
});

/* ---------- 渲染 ---------- */
function soloState(i) {
  if (soloDone.has(i)) return 'done';
  for (let k = 0; k < TOTAL; k++) if (!soloDone.has(k)) return k === i ? 'next' : 'idle';
  return 'done';
}
function duoState(i) {
  if (mine.includes(i)) return mineDone.has(i) ? 'done' : 'next';
  return theirsDone.has(i) ? 'peerDone' : 'peer';
}

function paintNode(i, state, chip) {
  const a = el.nodeLayer.children[i];
  const dict = d();
  a.dataset.state = state;
  a.querySelector('.chip').textContent = chip || '';
  const label = {
    done: dict.stDuoDone, next: dict.stEnter, peer: dict.chipPeer,
    peerDone: dict.stDuoDone, idle: dict.stEnter, locked: dict.stLocked
  }[state];
  a.setAttribute('aria-label', dict.nodes[i].name + ', ' + label);

  const url = CONFIG.NODES[i].url || '';
  const openable = mode === 'duo'
    ? (state === 'next' && isMyTurn() && !duoOver)
    : (mode === 'solo');
  if (openable && url) {
    a.setAttribute('href', url);
    if (CONFIG.OPEN_MODE === 'blank') a.setAttribute('target', '_blank');
    a.setAttribute('rel', 'noopener noreferrer');
    a.removeAttribute('aria-disabled');
  } else {
    a.removeAttribute('href');
    a.removeAttribute('target');
    if (mode === 'duo') a.setAttribute('aria-disabled', 'true');
  }
}

function paintRoute(activeFn) {
  [...el.route.querySelectorAll('line')].forEach(l => {
    l.classList.toggle('on', activeFn(Number(l.dataset.segment)));
  });
}

function paintTicks(mineOn, theirsOn) {
  [...el.ticks.children].forEach((t, i) => {
    t.classList.toggle('on', !!mineOn(i));
    t.classList.toggle('peer', !mineOn(i) && !!theirsOn(i));
  });
}

function paintStops(stateFn, textFn) {
  const dict = d();
  [...el.stops.children].forEach((li, i) => {
    li.dataset.state = stateFn(i);
    li.querySelector('.s-nm').textContent = dict.nodes[i].name;
    li.querySelector('.s-nt').textContent = dict.nodes[i].note;
    li.querySelector('.s-state').textContent = textFn(i);
  });
}

function render() {
  if (!mode) return;
  const dict = d();

  if (mode === 'duo') {
    const turn = isMyTurn();
    el.doneNum.textContent = String(Math.min(duoIdx, TOTAL));
    el.doneTotal.textContent = ' / 4';
    el.counterLabel.textContent = dict.doneLabel;
    el.hint.textContent = dict.hintDuo;

    CONFIG.NODES.forEach((n, i) => {
      const st = i < duoIdx ? 'done' : i === duoIdx ? 'next' : 'locked';
      const chip = st === 'next' ? (turn ? dict.chipTurnYou : dict.chipTurnPeer)
        : st === 'locked' ? dict.chipLocked : '';
      paintNode(i, st, chip);
    });

    paintRoute(i => i + 1 < duoIdx);
    paintTicks(i => i < duoIdx, () => false);

    paintStops(
      i => i < duoIdx ? 'done' : i === duoIdx ? 'next' : 'idle',
      i => {
        if (i < duoIdx) return dict.stSoloDone;
        if (i > duoIdx) return dict.stLocked;
        if (duoOpen) return turn ? dict.stPlayingYou : dict.stPlayingPeer;
        return turn ? dict.stYourTurn : dict.stPeerTurn;
      }
    );

    if (duoOver) {
      el.status.innerHTML = '<span>' + (duoOver === 'win' ? dict.duoWinTitle : dict.duoFailTitle) + '</span>';
    } else if (duoIdx < TOTAL) {
      el.status.innerHTML = dict.statusDuo2(duoIdx + 1, dict.nodes[duoIdx].name, turn);
    }
    syncHpState();
    return;
  }

  el.doneNum.textContent = String(soloDone.size);
  el.doneTotal.textContent = ' / 4';
  el.counterLabel.textContent = dict.doneLabel;
  el.hint.textContent = dict.hintSolo;

  CONFIG.NODES.forEach((n, i) => {
    const st = soloState(i);
    paintNode(i, st, st === 'next' ? dict.nodes[i].name + ' · ' + dict.nodes[i].note : '');
    el.nodeLayer.children[i].removeAttribute('aria-disabled');
  });

  paintRoute(i => soloDone.has(i) && soloDone.has(i + 1));
  paintTicks(i => soloDone.has(i), () => false);

  paintStops(
    i => soloState(i),
    i => soloState(i) === 'done' ? dict.stSoloDone
      : soloState(i) === 'next' ? dict.stSoloRec : dict.stEnter
  );

  let hi = -1;
  for (let i = 0; i < TOTAL; i++) { if (!soloDone.has(i)) { hi = i; break; } }
  if (hi === -1) {
    el.status.innerHTML = '<span>' + dict.statusSoloAll + '</span>';
  } else {
    el.status.innerHTML = dict.statusSoloNext(dict.nodes[hi].name);
  }
}

}

/* ---------- 双人：配对 ---------- */
const MQ_URL = 'wss://broker.emqx.io:8084/mqtt';
const TOPIC_LOBBY = 'seahub/transit/lobby/v2';
const TOPIC_ROOM = 'seahub/transit/room/v2';
const MYID = 'p' + Math.random().toString(36).slice(2, 8);

function setSearchKey(key) {
  searchKey = key;
  el.searchText.textContent = d()[key] || d().sConnect;
}
function setSearchText(t) { el.searchText.textContent = t; }

function publish(topic, obj) {
  if (mq && mq.connected) {
    try { mq.publish(topic, JSON.stringify(obj)); } catch (e) {}
  }
}

function connectMQ() {
  return new Promise((resolve, reject) => {
    if (typeof mqtt === 'undefined') { reject(new Error('lib')); return; }
    const c = mqtt.connect(MQ_URL, {
      clientId: MYID, clean: true, reconnectPeriod: 3000,
      connectTimeout: 9000, keepalive: 25
    });
    mq = c;
    let settled = false;
    const timer = setTimeout(() => {
      if (settled) return;
      settled = true;
      try { c.end(true); } catch (e) {}
      reject(new Error('timeout'));
    }, 11000);

    c.on('connect', () => {
      if (!settled) {
        settled = true;
        clearTimeout(timer);
        resolve();
        firstConnectDone = true;
        return;
      }
      if (firstConnectDone) onReconnected();
    });
    c.on('error', (err) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      try { c.end(true); } catch (e) {}
      reject(err || new Error('error'));
    });
    c.on('message', (topic, payload) => {
      let m = null;
      try { m = JSON.parse(payload.toString()); } catch (e) { return; }
      onMqMessage(topic, m);
    });
    c.on('close', () => {
      if (mode === 'duo' && netState === 'playing' && !duoOver) {
        linkDown = true;
        showToast(d().sLinkLost);
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(() => {
          if (!linkDown) return;
          try { c.reconnect(); } catch (e) {}
        }, 3000);
        setTimeout(() => { if (linkDown) showToast(d().sLinkFail); }, 45000);
      }
    });
    c.on('reconnect', () => {
      if (linkDown) showToast(d().sLinkLost);
    });
  });
}

function publishState() {
  send({ t: 'sync', idx: duoIdx, open: duoOpen, over: duoOver, hp: hp, ts: Date.now() });
}

function applyPeerState(m) {
  let adopted = false;
  const idx = Number.isFinite(m.idx) ? Math.min(Math.max(0, Math.round(m.idx)), TOTAL) : null;
  if (idx !== null) {
    if (idx > duoIdx) {
      duoIdx = idx;
      duoOpen = !!m.open;
      if (Number.isFinite(m.hp)) hp = clampHp(m.hp);
      saveHp(); renderHp(); render();
      adopted = true;
      if (idx >= TOTAL && !duoOver) {
        endDuo((m.over === 'fail' || hp <= 0) ? 'fail' : 'win');
        adopted = true;
      }
    } else if (idx === duoIdx) {
      if (!!m.open && !duoOpen && !duoOver) { duoOpen = true; render(); adopted = true; }
      if (m.open && Number.isFinite(m.hp) && !isMyTurn()) { hp = clampHp(m.hp); saveHp(); renderHp(); }
    }
  }
  if (m.over && !duoOver) { endDuo(m.over); adopted = true; }
  return adopted;
}

function requestSync(n) {
  n = n || 0;
  if (netState !== 'playing' || !partner) return;
  publishState();
  if (n < 3) setTimeout(() => requestSync(n + 1), 1500);
}

function onReconnected() {
  const wasDown = linkDown;
  linkDown = false;
  clearTimeout(reconnectTimer);
  if (!mq) return;
  try { mq.subscribe(TOPIC_LOBBY); mq.subscribe(TOPIC_ROOM); } catch (e) {}
  if (netState === 'playing' && !duoOver) {
    if (!isMyTurn()) renderHp();
    requestSync(0);
    if (wasDown) showToast(d().sLinkBack);
  } else if (netState === 'waiting' || netState === 'host' || netState === 'guest') {
    publish(TOPIC_LOBBY, { t: 'join', from: MYID, ts: Date.now() });
  }
}

function stopPeer() {
  clearTimeout(searchTimer);
  if (mq) {
    try { publish(TOPIC_LOBBY, { t: 'leave', from: MYID, ts: Date.now() }); } catch (e) {}
    try { mq.end(true); } catch (e) {}
  }
  mq = null;
  partner = null;
  netState = 'idle';
}

async function startDuo() {
  mode = 'duo';
  won = false;
  role = null;
  partner = null;
  netState = 'idle';
  winBase = null;
  duoIdx = 0; duoOpen = false; duoOver = null;
  mine = []; theirs = [];
  mineDone.clear(); theirsDone.clear();
  winBase = null;
  el.winVeil.classList.remove('on');
  el.lobby.classList.add('is-hidden');
  el.headBtn.classList.add('is-hidden');
  el.modeBtn.classList.add('is-hidden');
  el.searchVeil.classList.add('on');
  setSearchKey('sConnect');

  try {
    await connectMQ();
  } catch (err) {
    setSearchKey('sNoServer');
    return;
  }

  mq.subscribe(TOPIC_LOBBY);
  mq.subscribe(TOPIC_ROOM);
  netState = 'waiting';
  setSearchKey('sSearch');
  publish(TOPIC_LOBBY, { t: 'join', from: MYID, ts: Date.now() });

  setTimeout(() => {
    if (netState !== 'waiting') return;
    publish(TOPIC_LOBBY, { t: 'join', from: MYID, ts: Date.now() });
  }, 1200);

  searchTimer = setTimeout(() => {
    if (netState !== 'waiting') return;
    publish(TOPIC_LOBBY, { t: 'join', from: MYID, ts: Date.now() });
    setSearchKey('sWaiting');
  }, 6000);
}

function offerTo(id, n) {
  n = n || 0;
  publish(TOPIC_ROOM, { t: 'offer', from: MYID, to: id });
  setTimeout(() => {
    if (netState !== 'host' || partner !== id || n >= 4) return;
    offerTo(id, n + 1);
  }, 2500);
}

function onMqMessage(topic, m) {
  if (!m || typeof m !== 'object' || m.from === MYID) return;
  if (m.t === 'join' || m.t === 'offer') onLobby(m);
  else onRoom(m);
}

function onLobby(m) {
  if (m.t === 'join') {
    if (netState === 'waiting' && !partner) {
      const delay = 200 + Math.random() * 500;
      setTimeout(() => {
        if (netState !== 'waiting' || partner) return;
        partner = m.from;
        netState = 'host';
        setSearchKey('sFound');
        offerTo(partner);
      }, delay);
    }
  } else if (m.t === 'offer') {
    if (netState === 'waiting') {
      partner = m.from;
      netState = 'guest';
      role = 'guest';
      setSearchKey('sSync');
      publish(TOPIC_ROOM, { t: 'ready', from: MYID, to: m.from });
      retryReady();
    } else if (netState === 'host' && partner === m.from) {
      if (MYID > partner) {
        netState = 'guest';
        role = 'guest';
        setSearchKey('sSync');
        publish(TOPIC_ROOM, { t: 'ready', from: MYID, to: partner });
        retryReady();
      }
    }
  }
}

function retryReady(n) {
  n = n || 0;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    if (netState !== 'guest' || !partner || n >= 4) return;
    publish(TOPIC_ROOM, { t: 'ready', from: MYID, to: partner });
    retryReady(n + 1);
  }, 2500);
}

function onRoom(m) {
  if (netState !== 'playing' && m.t !== 'ready' && m.t !== 'start') {
    if (!(m.t === 'start' && netState === 'guest')) return;
  }
  if (m.t === 'ready' && netState === 'host') {
    hostStart();
  } else if (m.t === 'start' && netState === 'guest') {
    clearTimeout(searchTimer);
    role = 'guest';
    duoIdx = 0; duoOpen = false; duoOver = null; won = false;
    hp = Number.isFinite(m.hp) ? clampHp(m.hp) : CONFIG.HP_MAX;
    saveHp(); renderHp();
    enterDuoGame();
  } else if (netState === 'playing') {
    if (m.t === 'open') {
      if (typeof m.i !== 'number') return;
      duoOpen = true; render();
    } else if (m.t === 'hp') {
      if (!Number.isFinite(m.hp)) return;
      hp = clampHp(m.hp); saveHp(); renderHp(); render();
    } else if (m.t === 'settle') {
      if (typeof m.next !== 'number') return;
      applySettle(m.next, Number.isFinite(m.hp) ? m.hp : hp);
    } else if (m.t === 'sync' || m.t === 'state') {
      const adopted = applyPeerState(m);
      const peerIdx = Number.isFinite(m.idx) ? m.idx : -1;
      const now = Date.now();
      if ((adopted || peerIdx < duoIdx || (peerIdx === duoIdx && !!m.open !== duoOpen)) && now - lastSyncSent > 800) {
        lastSyncSent = now;
        publishState();
      }
    } else if (m.t === 'die') {
      endDuo('fail');
    } else if (m.t === 'win') {
      endDuo('win');
    }
  }
}

function hostStart() {
  clearTimeout(searchTimer);
  role = 'host';
  duoIdx = 0; duoOpen = false; duoOver = null; won = false;
  hp = CONFIG.HP_MAX; saveHp(); renderHp();
  const msg = { t: 'start', from: MYID, to: partner, idx: 0, hp: hp };
  publish(TOPIC_ROOM, msg);
  setTimeout(() => publish(TOPIC_ROOM, msg), 800);
  enterDuoGame();
}

function applySettle(next, value) {
  duoIdx = Math.min(Math.max(duoIdx, next), TOTAL);
  duoOpen = false;
  hp = clampHp(Number.isFinite(value) ? value : hp);
  saveHp(); renderHp(); render();
  if (duoIdx >= TOTAL) endDuo(hp > 0 ? 'win' : 'fail');
}

function endDuo(type) {
  if (duoOver) return;
  duoOver = type;
  won = type === 'win';
  const dd = d();
  el.winTitle.textContent = type === 'win' ? dd.duoWinTitle : dd.duoFailTitle;
  el.winText.textContent = '';
  renderHp(); render();
  el.winVeil.classList.add('on');
}

function send(obj) {
  if (!partner) return;
  publish(TOPIC_ROOM, Object.assign({ from: MYID, to: partner }, obj));
}

function enterDuoGame() {
  netState = 'playing';
  duoOpen = false;
  el.searchVeil.classList.remove('on');
  showStage();
  el.modeBtn.classList.add('is-hidden');
  setHeadBtn(d().exitDuo, () => { stopPeer(); resetDuo(); showLobby(); });
  render();
}

function resetDuo() {
  mode = null; role = null; won = false;
  duoIdx = 0; duoOpen = false; duoOver = null;
  winBase = null;
  duoIdx = 0; duoOpen = false; duoOver = null;
  mine = []; theirs = [];
  mineDone.clear(); theirsDone.clear();
  winBase = null;
  el.winVeil.classList.remove('on');
  syncHpState();
}



/* ---------- 入口 ---------- */
[...document.querySelectorAll('.mode')].forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.mode === 'solo') startSolo();
    else startDuo();
  });
});

function previewHp(v) {
  if (!el.hpFill) return;
  const pv = clampHp(v);
  el.hpFill.style.width = (pv / CONFIG.HP_MAX * 100) + '%';
}

function readDraft() {
  const v = parseInt(el.hpInput.value, 10);
  return clampHp(Number.isFinite(v) ? v : hp);
}

function onHpEdited() {
  clearPending();
  if (mode === 'duo') {
    // 双人：只更新预览，等「確認」才保存
    previewHp(readDraft());
    syncHpState();
    return;
  }
  hp = readDraft();
  saveHp(); renderHp();
}

function confirmRecord() {
  if (mode !== 'duo' || duoOver || !duoOpen || isMyTurn()) return;
  hp = readDraft();
  saveHp(); clearPending();
  duoOpen = false;
  send({ t: 'settle', next: duoIdx + 1, hp });
  applySettle(duoIdx + 1, hp);
}

el.duoConfirmBtn.addEventListener('click', confirmRecord);

function stepHp(dir) {
  if (mode === 'duo') {
    el.hpInput.value = String(clampHp(readDraft() + dir * CONFIG.HP_STEP));
    onHpEdited();
    return;
  }
  hp = clampHp(hp + dir * CONFIG.HP_STEP);
  el.hpInput.value = String(hp);
  onHpEdited();
}

el.hpDown.addEventListener('click', () => stepHp(-1));
el.hpUp.addEventListener('click', () => stepHp(1));
el.hpInput.addEventListener('change', onHpEdited);

el.dieBtn.addEventListener('click', () => {
  if (mode !== 'duo' || duoOver || isMyTurn()) return;
  send({ t: 'die' });
  endDuo('fail');
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (mq && !mq.connected && (netState === 'playing' || netState === 'waiting')) {
    linkDown = true;
    try { mq.reconnect(); } catch (e) {}
  }
  promptSettle();
});

if (el.toast) {
  el.toast.addEventListener('click', () => {
    if (!linkDown || !mq) return;
    try { mq.reconnect(); } catch (e) {}
    showToast(d().sLinkLost);
  });
}

el.cancelSearch.addEventListener('click', goHome);
el.backHome.addEventListener('click', goHome);
window.addEventListener('beforeunload', () => { try { mq && mq.end(true); } catch (e) {} });

applyLang();
renderHp();
syncHpState();
showLobby();
</script>
</body>
</html>
